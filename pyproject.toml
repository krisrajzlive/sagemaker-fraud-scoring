[project]
name = "sagemaker-fraud-scoring"
version = "0.1.0"
description = "Transaction fraud-risk scoring on Amazon SageMaker: PyTorch script-mode training and real-time inference in the official AWS containers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "scikit-learn>=1.5",
    "torch==2.5.1",
    "sagemaker>=3.24,<4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
fraud-scoring = "fraud_scoring.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_scoring"]

# CPU-only torch on Linux (CI): the default PyPI wheel drags in ~2 GB of CUDA libraries.
# Windows and macOS wheels from PyPI are already CPU builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
    "docker: needs a running Docker daemon and the AWS PyTorch containers (deselected by default; run with -m docker)",
]
